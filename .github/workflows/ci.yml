name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHALK_OFFLINE: "1"  # the offline crew: no model calls, no secrets needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Simulate a match end to end
        run: python scripts/generate_match.py
      - name: Tests
        run: python -m pytest -q
