<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHALK match replay</title>
  <meta name="description" content="CHALK, the AI pundit that draws on the pitch. Synthetic match replay.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2a0a3d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Kalam:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="CHALK home">
      <img src="logo.svg" alt="" width="36" height="36">
      <span class="wordmark">chalk</span>
    </a>
    <div class="fixture">
      <p class="fixture-teams" id="matchTitle">Loading match…</p>
      <p class="fixture-meta" id="matchMeta"></p>
    </div>
    <p class="feed-pill" title="All clubs, players and events are generated by code">
      <span class="dot" aria-hidden="true"></span>Synthetic feed
    </p>
    <div class="view-toggle" role="group" aria-label="Pitch view">
      <button type="button" data-view="3d" class="on" aria-pressed="true">Broadcast</button>
      <button type="button" data-view="2d" aria-pressed="false">Tactical</button>
    </div>
  </header>

  <main class="stage">
    <section class="hero" aria-label="Match pitch">
      <canvas id="pitch" role="img" aria-label="Animated pitch showing player and ball positions"></canvas>
      <div class="scorebug" aria-live="polite">
        <span class="sb-chip sb-home" aria-hidden="true"></span>
        <span class="sb-team" id="sbHome">ASH</span>
        <span class="sb-score" id="sbScore">0 – 0</span>
        <span class="sb-team" id="sbAway">KES</span>
        <span class="sb-chip sb-away" aria-hidden="true"></span>
        <span class="sb-clock" id="sbClock">0'</span>
      </div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
      <label class="names-toggle"><input type="checkbox" id="namesToggle" checked> Player names</label>
    </section>

    <section class="deck" aria-label="Playback and match pulse">
      <button type="button" id="playBtn" class="play" aria-label="Play" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
      </button>
      <div class="pulse-wrap">
        <div class="pulse-head">
          <h2 class="panel-title">Match pulse</h2>
          <p class="pulse-legend">
            <span class="lg lg-home" id="lgHome">Ashvale on top</span>
            <span class="lg lg-away" id="lgAway">Kestrel on top</span>
            <span class="lg lg-chaos">Chaotic spell</span>
          </p>
        </div>
        <div class="pulse-track">
          <canvas id="pulse" aria-hidden="true"></canvas>
          <input type="range" id="scrub" class="scrub" min="0" max="1000" step="1" value="0" aria-label="Match time">
        </div>
      </div>
      <div class="speeds" role="group" aria-label="Playback speed">
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="4">4×</button>
        <button type="button" data-speed="10" class="on">10×</button>
        <button type="button" data-speed="30">30×</button>
      </div>
    </section>

    <aside class="side">
      <section class="panel" aria-labelledby="statsTitle">
        <div class="panel-head">
          <h2 class="panel-title" id="statsTitle">Match stats</h2>
          <p class="panel-sides"><span id="stHome">ASH</span><span id="stAway">KES</span></p>
        </div>
        <ul class="stat-list" id="statList"></ul>
      </section>
      <section class="panel panel-moments" aria-labelledby="momentsTitle">
        <div class="panel-head">
          <h2 class="panel-title" id="momentsTitle">Key moments</h2>
          <p class="panel-count" id="momentCount"></p>
        </div>
        <ol class="moment-list" id="momentList"></ol>
        <p class="moment-empty" id="momentEmpty">Moments appear here as the match unfolds. Select one to watch it again.</p>
      </section>
    </aside>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ic-goal" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.6l2.6 1.9-1 3H6.4l-1-3z" fill="currentColor"/></symbol>
      <symbol id="ic-card" viewBox="0 0 16 16"><rect x="4.5" y="2.5" width="7" height="11" rx="1.2" fill="#e5484d"/></symbol>
      <symbol id="ic-chance" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2" fill="currentColor"/></symbol>
      <symbol id="ic-press" viewBox="0 0 16 16"><path d="M2.5 11.5c2-4 4-4 6 0s4 4 5-1M2.5 6.5c2-4 4-4 6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="ic-swing" viewBox="0 0 16 16"><path d="M2.5 10.5l3.5-4 3 3 4.5-6M10.5 3.5h3v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ic-shift" viewBox="0 0 16 16"><circle cx="4" cy="4" r="1.6" fill="currentColor"/><circle cx="12" cy="4" r="1.6" fill="currentColor"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><circle cx="4" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="ic-sub" viewBox="0 0 16 16"><path d="M3 5.5h9l-2.5-2.5M13 10.5H4l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ic-speed" viewBox="0 0 16 16"><path d="M2 5h6M1 8h7M3 11h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 3.5l5 4.5-5 4.5z" fill="currentColor"/></symbol>
      <symbol id="ic-star" viewBox="0 0 16 16"><path d="M8 2l1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.4 4.3 13.5l.8-4.2L2 6.4l4.2-.5z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <script type="module" src="app.js"></script>
</body>
</html>
